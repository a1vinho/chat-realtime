<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <title>Chat </title>
</head>

<body>
    <header>
        <h1>Chat em tempo real</h1>
    </header>

    <main>

        <div class="container">

            <div class="login-container">
                <p>Com seu nome de usuário você será apelidado no sistema e reconhecido por outros usuários</p>
                <form id="form-login">
                    <div>
                        <input type="text" placeholder="Nome de usuário" id="username">
                        <button type="submit">Continuar</button>
                    </div>
                </form>
                <p>Acesse: <a href="https://github.com/a1vinho/">Github</a></p>
            </div>

            <div class="chat-container" style="display: none;">
                <div class="notifications-buttons" style="display: flex; justify-content: end; align-items: center;">
                    <button type="button" id="notification-button" style="border:none; background-color: transparent; cursor: pointer;" id="notification-button" aria-label="Notificações">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" class="lucide lucide-bell">
                            <path
                                d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0">
                            </path>
                        </svg>
                    </button>
                </div>
                <div class="notifications">
                    <div class="container-notifications">
                        <!-- <div class="notification">
                            <div class="notification-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="9" cy="7" r="4"></circle>
                                    <line x1="19" y1="8" x2="19" y2="14"></line>
                                    <line x1="22" y1="11" x2="16" y2="11"></line>
                                </svg>
                            </div>

                            <p class="notification-text">O usuário <strong>Matheus</strong> entrou no chat</p>

                            <button class="notification-close" aria-label="Fechar notificação">&times;</button>
                        </div> -->
                    </div>
                </div>
                <div class="container-messagens" style="height: 100%; overflow-y: auto; padding: 10px;">
                    <div class="message">
                        <strong>Maria</strong>
                        <p>Olá, tudo bem?</p>
                        <span>10:30 AM</span>
                    </div>
                </div>
                <div class="form-send-message">
                    <form id="form-message">

                        <input type="text" placeholder="Digite sua mensagem" id="message">

                        <div class="buttons">
                            <input type="file" id="file-input" style="display: none;">
                            <button type="submit">Enviar</button>
                            <label for="file-input" class="file-label" style="cursor: pointer;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" class="lucide lucide-file preview-icon">
                                    <path
                                        d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" />
                                    <path d="M14 2v5a1 1 0 0 0 1 1h5" />
                                </svg>
                            </label>

                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
